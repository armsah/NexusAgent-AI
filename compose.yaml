services:
  postgres:
    image: postgres:17-alpine
    container_name: nexusagent-postgres
    environment:
      POSTGRES_DB: nexusagent
      POSTGRES_USER: nexusagent
      POSTGRES_PASSWORD: nexusagent_dev_only
    ports:
      - "15432:5432"
    volumes:
      - nexusagent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusagent -d nexusagent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  nexusagent-postgres-data: